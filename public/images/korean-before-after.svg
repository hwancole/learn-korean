<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#eff6ff"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#1d4ed8" opacity=".18">
      <text x="180" y="95">수업 전에</text><text x="1020" y="95">10분 후에</text>
      <text x="200" y="585">3년 전에</text><text x="1000" y="585">끝난 다음에</text>
    </g>
    <g font-size="52" font-weight="500" fill="#1e40af">
      <text x="340" y="170">자다</text><text x="860" y="170">먹다</text>
    </g>
    <g font-size="40" fill="#3b82f6">
      <text x="340" y="235">↓</text><text x="860" y="235">↓</text>
    </g>
    <g font-size="72" font-weight="700" fill="#1e3a8a">
      <text x="340" y="330">자기 전에</text><text x="860" y="330">먹은 후에</text>
    </g>
    <g font-size="30" font-weight="500" fill="#1d4ed8">
      <text x="340" y="390">jagi jeone · before sleeping</text><text x="860" y="390">meogeun hue · after eating</text>
    </g>
    <line x1="600" y1="140" x2="600" y2="410" stroke="#bfdbfe" stroke-width="3"/>
    <text x="600" y="495" font-size="48" font-weight="700" fill="#1e3a8a">Before &amp; After in Korean: 전에 · 후에</text>
  </g>
</svg>
