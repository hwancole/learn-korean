<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#fff7ed"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#c2410c" opacity=".18">
      <text x="190" y="95">안 가도 돼요</text><text x="1010" y="95">가면 안 돼요</text>
      <text x="200" y="590">가야겠어요</text><text x="1000" y="590">나 가야 돼!</text>
    </g>
    <g font-size="56" font-weight="500" fill="#9a3412">
      <text x="340" y="150">가다</text><text x="860" y="150">먹다</text>
    </g>
    <g font-size="28" font-weight="500" fill="#ea580c">
      <text x="340" y="190">ir</text><text x="860" y="190">comer</text>
    </g>
    <g font-size="40" fill="#f97316">
      <text x="340" y="245">↓</text><text x="860" y="245">↓</text>
    </g>
    <g font-size="68" font-weight="700" fill="#7c2d12">
      <text x="340" y="330">가야 해요</text><text x="860" y="330">먹어야 해요</text>
    </g>
    <g font-size="30" font-weight="500" fill="#ea580c">
      <text x="340" y="380">gaya haeyo · tengo que ir</text><text x="860" y="380">meogeoya haeyo · tengo que comer</text>
    </g>
    <line x1="600" y1="120" x2="600" y2="410" stroke="#fed7aa" stroke-width="3"/>
    <text x="600" y="490" font-size="48" font-weight="700" fill="#7c2d12">"Tener que" en coreano: -아야/어야 해요</text>
  </g>
</svg>
