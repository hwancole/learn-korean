<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f0fdf4"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#15803d" opacity=".18">
      <text x="190" y="95">먹을 수 있어요</text><text x="1010" y="95">할 수 있어요</text>
      <text x="190" y="585">만들 수 있어요</text><text x="1010" y="585">못 가요</text>
    </g>
    <text x="600" y="165" font-size="52" font-weight="500" fill="#166534">가다</text>
    <g font-size="40" fill="#22c55e">
      <text x="450" y="230">↙</text><text x="750" y="230">↘</text>
    </g>
    <g font-size="64" font-weight="700" fill="#14532d">
      <text x="330" y="330">갈 수 있어요</text><text x="870" y="330">갈 수 없어요</text>
    </g>
    <g font-size="28" font-weight="500" fill="#15803d">
      <text x="330" y="385">gal su isseoyo · I can go</text><text x="870" y="385">gal su eopseoyo · I can't go</text>
    </g>
    <line x1="600" y1="260" x2="600" y2="410" stroke="#bbf7d0" stroke-width="3"/>
    <text x="600" y="495" font-size="46" font-weight="700" fill="#14532d">Can and can't in Korean: -(으)ㄹ 수 있어요</text>
  </g>
</svg>
