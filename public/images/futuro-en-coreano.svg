<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#eef6f3"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#0f766e" opacity=".25">
      <text x="190" y="100">볼 거예요</text><text x="1010" y="100">마실 거예요</text>
      <text x="190" y="580">추울 거예요</text><text x="1010" y="580">할게요</text>
    </g>
    <g fill="#134e4a" font-weight="700" font-size="64">
      <text x="230" y="215">가다</text><text x="600" y="215">먹다</text><text x="970" y="215">하다</text>
    </g>
    <g fill="#0f766e" font-size="48">
      <text x="230" y="275">↓</text><text x="600" y="275">↓</text><text x="970" y="275">↓</text>
