    <g fill="#134e4a" font-weight="700" font-size="58">
      <text x="230" y="370">갈 거예요</text><text x="600" y="370">먹을 거예요</text><text x="970" y="370">할 거예요</text>
    </g>
    <g font-size="28" font-weight="500" fill="#0f766e">
      <text x="230" y="420">gal geoyeyo · iré</text><text x="600" y="420">meogeul geoyeyo · comeré</text><text x="970" y="420">hal geoyeyo · haré</text>
    </g>
    <line x1="415" y1="170" x2="415" y2="430" stroke="#99c9bf" stroke-width="3"/>
    <line x1="785" y1="170" x2="785" y2="430" stroke="#99c9bf" stroke-width="3"/>
    <text x="600" y="510" font-size="48" font-weight="700" fill="#134e4a">El futuro en coreano</text>
  </g>
