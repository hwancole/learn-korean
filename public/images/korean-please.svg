<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f0fdf4"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#15803d" opacity=".16">
      <text x="180" y="95">이거 주세요</text><text x="1020" y="95">도와주세요</text>
      <text x="190" y="585">말해 주세요</text><text x="1010" y="585">가지 마세요</text>
    </g>
    <g font-size="52" font-weight="500" fill="#166534">
      <text x="330" y="170">물</text><text x="870" y="170">기다리다</text>
    </g>
    <g font-size="40" fill="#22c55e">
      <text x="330" y="235">↓</text><text x="870" y="235">↓</text>
    </g>
    <g font-size="70" font-weight="700" fill="#14532d">
      <text x="330" y="335">물 주세요</text><text x="870" y="335">기다려 주세요</text>
    </g>
    <g font-size="28" font-weight="500" fill="#15803d">
      <text x="330" y="390">mul juseyo · Water, please</text><text x="870" y="390">gidaryeo juseyo · Please wait</text>
    </g>
    <line x1="600" y1="140" x2="600" y2="410" stroke="#bbf7d0" stroke-width="3"/>
    <text x="600" y="495" font-size="48" font-weight="700" fill="#14532d">"Please" in Korean: 주세요 and -아/어 주세요</text>
  </g>
