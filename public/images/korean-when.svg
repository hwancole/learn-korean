    </g>
    <line x1="600" y1="140" x2="600" y2="410" stroke="#a7f3d0" stroke-width="3"/>
    <text x="600" y="495" font-size="48" font-weight="700" fill="#064e3b">"When" in Korean: -(으)ㄹ 때</text>
