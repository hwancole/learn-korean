<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ecfdf5"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#047857" opacity=".18">
      <text x="180" y="95">어렸을 때</text><text x="1020" y="95">방학 때</text>
      <text x="200" y="585">만들 때</text><text x="1000" y="585">들을 때마다</text>
    </g>
    <g font-size="52" font-weight="500" fill="#065f46">
      <text x="340" y="170">가다</text><text x="860" y="170">먹다</text>
    </g>
    <g font-size="40" fill="#10b981">
