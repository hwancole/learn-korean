<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#eef3fa"/>
  <g fill="#c7d6ea">
    <circle cx="960" cy="150" r="58"/><circle cx="1030" cy="130" r="72"/><circle cx="1100" cy="160" r="52"/>
    <rect x="910" y="150" width="240" height="62" rx="31"/>
  </g>
  <g stroke="#7aa0cf" stroke-width="6" stroke-linecap="round">
    <line x1="960" y1="240" x2="948" y2="272"/><line x1="1020" y1="240" x2="1008" y2="272"/><line x1="1080" y1="240" x2="1068" y2="272"/>
  </g>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
    <g font-size="40" font-weight="700" fill="#1e3a5f" opacity=".2">
      <text x="80" y="110">아닌 것 같아요</text><text x="760" y="585">그런 것 같아요</text>
    </g>
    <text x="90" y="290" font-size="80" font-weight="700" fill="#1e3a5f">비가 <tspan fill="#2563eb">오는</tspan> 것 같아요</text>
    <text x="90" y="340" font-size="34" font-weight="500" fill="#3b5b85">It seems to be raining</text>
    <text x="90" y="450" font-size="80" font-weight="700" fill="#1e3a5f">비가 <tspan fill="#2563eb">올</tspan> 것 같아요</text>
    <text x="90" y="500" font-size="34" font-weight="500" fill="#3b5b85">I think it's going to rain</text>
    <text x="90" y="585" font-size="44" font-weight="700" fill="#1e3a5f">"I think" in Korean</text>
  </g>
</svg>
