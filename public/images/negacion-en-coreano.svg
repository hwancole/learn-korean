<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f3f1fd"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#be123c" opacity=".2">
      <text x="170" y="95">없어요</text><text x="1030" y="95">몰라요</text>
      <text x="200" y="585">-지 않아요</text><text x="1000" y="585">아니에요</text>
    </g>
    <text x="600" y="150" font-size="60" font-weight="500" fill="#9f1239">가요</text>
    <text x="600" y="190" font-size="30" font-weight="500" fill="#be123c">gayo · voy</text>
    <g font-size="40" fill="#f43f5e">
      <text x="400" y="250">↙</text><text x="800" y="250">↘</text>
    </g>
    <g font-size="72" font-weight="700" fill="#881337">
      <text x="340" y="350">안 가요</text><text x="860" y="350">못 가요</text>
    </g>
    <g font-size="32" font-weight="500" fill="#be123c">
      <text x="340" y="405">an gayo · no voy</text><text x="860" y="405">mot gayo · no puedo ir</text>
    </g>
    <line x1="600" y1="270" x2="600" y2="430" stroke="#fbcfd8" stroke-width="3"/>
    <text x="600" y="505" font-size="48" font-weight="700" fill="#881337">La negación en coreano: 안 y 못</text>
  </g>
</svg>
