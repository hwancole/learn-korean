<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f0fdf4"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#15803d" opacity=".18">
      <text x="180" y="95">못 가요</text><text x="1020" y="95">할 줄 알아요</text>
      <text x="200" y="590">찍어도 돼요?</text><text x="1000" y="590">할 수 있어!</text>
    </g>
    <text x="600" y="120" font-size="56" font-weight="500" fill="#166534">가다</text>
    <text x="600" y="160" font-size="28" font-weight="500" fill="#16a34a">ir</text>
    <g font-size="40" fill="#22c55e">
      <text x="400" y="225">↙</text><text x="800" y="225">↘</text>
    </g>
    <g font-size="68" font-weight="700" fill="#14532d">
      <text x="340" y="330">갈 수 있어요</text><text x="860" y="330">갈 수 없어요</text>
    </g>
    <g font-size="30" font-weight="500" fill="#16a34a">
      <text x="340" y="380">gal su isseoyo · puedo ir</text><text x="860" y="380">gal su eopseoyo · no puedo ir</text>
    </g>
    <line x1="600" y1="260" x2="600" y2="410" stroke="#bbf7d0" stroke-width="3"/>
    <text x="600" y="490" font-size="48" font-weight="700" fill="#14532d">"Poder" en coreano: -(으)ㄹ 수 있어요</text>
  </g>
</svg>
