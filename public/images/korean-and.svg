<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ecfdf5"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#047857" opacity=".18">
      <text x="180" y="95">와/과</text><text x="1020" y="95">그리고</text>
      <text x="200" y="585">빵이랑</text><text x="1000" y="585">먹고</text>
    </g>
    <g font-size="34" font-weight="500" fill="#059669">
      <text x="340" y="165">nouns</text><text x="860" y="165">verbs &amp; adjectives</text>
    </g>
    <g font-size="72" font-weight="700" fill="#064e3b">
      <text x="340" y="290">커피하고 빵</text><text x="860" y="290">싸고 맛있어요</text>
    </g>
    <g font-size="30" font-weight="500" fill="#047857">
      <text x="340" y="360">keopihago ppang</text><text x="860" y="360">ssago masisseoyo</text>
      <text x="340" y="400">coffee and bread</text><text x="860" y="400">cheap and tasty</text>
    </g>
    <line x1="600" y1="140" x2="600" y2="420" stroke="#a7f3d0" stroke-width="3"/>
    <text x="600" y="505" font-size="48" font-weight="700" fill="#064e3b">"And" in Korean: 하고 · -고 · 그리고</text>
  </g>
</svg>
