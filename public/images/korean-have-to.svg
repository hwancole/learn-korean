<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#eff6ff"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#1d4ed8" opacity=".16">
      <text x="180" y="95">해야 해요</text><text x="1020" y="95">와야 돼요</text>
      <text x="190" y="585">기다려야 해요</text><text x="1010" y="585">일어나야 해요</text>
    </g>
    <g font-size="52" font-weight="500" fill="#1e40af">
      <text x="330" y="170">가다</text><text x="870" y="170">먹다</text>
    </g>
    <g font-size="40" fill="#3b82f6">
      <text x="330" y="235">↓</text><text x="870" y="235">↓</text>
    </g>
    <g font-size="70" font-weight="700" fill="#1e3a8a">
      <text x="330" y="335">가야 해요</text><text x="870" y="335">먹어야 해요</text>
    </g>
    <g font-size="28" font-weight="500" fill="#1d4ed8">
      <text x="330" y="390">gaya haeyo · I have to go</text><text x="870" y="390">meogeoya haeyo · I have to eat</text>
    </g>
    <line x1="600" y1="140" x2="600" y2="410" stroke="#bfdbfe" stroke-width="3"/>
    <text x="600" y="495" font-size="48" font-weight="700" fill="#1e3a8a">"Have to" in Korean: -아야/어야 해요</text>
  </g>
</svg>
