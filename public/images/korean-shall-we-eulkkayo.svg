<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f0f7ff"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="44" font-weight="700" fill="#1d4ed8" opacity=".18">
      <text x="170" y="95">볼까요?</text><text x="1030" y="95">만날까요?</text>
      <text x="190" y="585">앉을까요?</text><text x="1010" y="585">들을까요?</text>
    </g>
    <g font-size="52" font-weight="500" fill="#1e40af">
      <text x="340" y="170">가다</text><text x="860" y="170">먹다</text>
    </g>
    <g font-size="40" fill="#3b82f6">
      <text x="340" y="235">↓</text><text x="860" y="235">↓</text>
    </g>
    <g font-size="76" font-weight="700" fill="#1e3a8a">
      <text x="340" y="335">갈까요?</text><text x="860" y="335">먹을까요?</text>
    </g>
    <g font-size="30" font-weight="500" fill="#1d4ed8">
      <text x="340" y="390">galkkayo · Shall we go?</text><text x="860" y="390">meogeulkkayo · Shall we eat?</text>
    </g>
    <line x1="600" y1="140" x2="600" y2="410" stroke="#bfdbfe" stroke-width="3"/>
    <text x="600" y="495" font-size="48" font-weight="700" fill="#1e3a8a">Korean -(으)ㄹ까요: Shall we? Shall I?</text>
  </g>
</svg>
